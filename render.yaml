# Render Blueprint for the AqoonJire backend (Express API).
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# The database stays on Supabase, so no DB service is defined here.
services:
  - type: web
    name: aqoonjire-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLATFORM_NAME
        value: AqoonJire
      # Set this to your live frontend URL(s), comma-separated.
      - key: FRONTEND_URL
        value: https://aqoonjire.com,https://www.aqoonjire.com
      # --- Secrets: set these in the Render dashboard (sync:false hides them) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "15000"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      - key: USE_CLOUDINARY
        value: "false"
